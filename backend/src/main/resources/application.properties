# ═══════════════════════════════════════════════
#  pHARe API — Configuration PostgreSQL
# ═══════════════════════════════════════════════

server.port=8080
spring.application.name=phare-api

# ── PostgreSQL ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/phare_db}
spring.datasource.username=${PGUSER:phare_user}
spring.datasource.password=${PGPASSWORD:phare_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Gestion des relations JSON (éviter les boucles) ──
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ── Sécurité ──
# Le secret partagé avec le service d'authentification (backend-node) : 32 octets ou plus. Sans lui, l'API ne démarre pas.
phare.jwt.secret=${JWT_SECRET:}
# Les origines du frontend autorisées par le CORS, séparées par des virgules.
phare.cors.allowed-origins=${PHARE_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}
