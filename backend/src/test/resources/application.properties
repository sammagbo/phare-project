# Les tests : une base H2 en mémoire et un secret de test, jamais celui d'un vrai serveur.
spring.application.name=phare-api
spring.datasource.url=jdbc:h2:mem:phare;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

phare.jwt.secret=test-only-secret-for-the-phare-api-tests-0123456789
phare.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000
